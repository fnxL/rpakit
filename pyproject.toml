[project]
name = "rpakit"
version = "0.1.2"
description = "A toolkit for RPA automation and ETL pipelines providing solutions to common automation challenges."
readme = "README.md"
authors = [{ name = "fnxL", email = "ajaykanki.2e@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.11"
keywords = ["rpa", "automation", "etl", "excel", "pdf", "polars", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "fastexcel>=0.21.0",
    "openpyxl>=3.1.5",
    "polars>=2.0.0",
    "python-calamine>=0.8.3",
    "xlsx2html>=0.6.4",
    "xlsxwriter>=3.2.9",
]

[project.urls]
Homepage = "https://github.com/fnxL/rpakit"
Issues = "https://github.com/fnxL/rpakit/issues"

[project.optional-dependencies]
pdf = ["pdf-oxide>=0.3.78", "pdfplumber>=0.11.10", "pypdf>=6.20.0"]
windows = []
filesystem = []
all = ["rpakit[pdf,windows,filesystem]"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
linting = ["ruff>=0.17.0"]
type-check = ["pyrefly>=1.3.2"]
test = ["coverage>=7.16.2", "pytest>=9.1.1"]
dev = [
    { include-group = "linting" },
    { include-group = "type-check" },
    { include-group = "test" },
    "pytest-benchmark>=5.2.3",
    "rpakit[all]",
]
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
