[project]
name = "rpakit"
version = "0.1.2"
description = "A Python toolkit for Robotic Process Automation (RPA) and ETL pipelines providing solutions to common automation challenges."
readme = "README.md"
authors = [{ name = "fnxL", email = "ajaykanki.2e@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.11"
keywords = ["rpa", "automation", "etl", "excel", "pdf", "polars", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "fastexcel>=0.21.0",
    "openpyxl>=3.1.5",
    "polars>=1.44.1",
    "python-calamine>=0.8.2",
    "xlsx2html>=0.6.4",
    "xlsxwriter>=3.2.9",
]

[project.urls]
Homepage = "https://github.com/fnxL/rpakit"
Issues = "https://github.com/fnxL/rpakit/issues"

[project.optional-dependencies]
pdf = ["pdf-oxide>=0.3.77", "pdfplumber>=0.11.10", "pypdf>=6.14.2"]
windows = []
filesystem = []

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
lint = ["pyrefly>=1.2.0", "ruff>=0.16.6"]
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "pytest-benchmark>=5.2.3",
    "rpakit[pdf,windows,filesystem]",
]

[tool.ruff]
target-version = "py311"

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
