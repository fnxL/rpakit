name: Release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_prerelease: ${{ steps.check_version.outputs.is_prerelease }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Check tag matches pyproject.toml version
        id: check_version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi

          # PEP 440 pre-release/dev markers, e.g. 0.1.2b1, 1.0.0rc1, 2.0.0.dev0
          if echo "$PYPROJECT_VERSION" | grep -qE '(a|b|rc)[0-9]+$|\.dev[0-9]+$'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl -- python -c "import rpakit"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/


  github-release:
    name: Create GitHub Release
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Determine previous tag
        id: previous_tag
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          IS_PRERELEASE="${{ needs.test.outputs.is_prerelease }}"

          # All version tags, newest first by creation order, excluding the current tag.
          ALL_TAGS="$(git tag --list 'v*.*.*' --sort=-creatordate | grep -v -x "$CURRENT_TAG")"

          PREV_TAG=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue

            if echo "$tag" | grep -qE '(a|b|rc)[0-9]+$|\.dev[0-9]+$'; then
              TAG_IS_PRERELEASE="true"
            else
              TAG_IS_PRERELEASE="false"
            fi

            if [ "$TAG_IS_PRERELEASE" = "$IS_PRERELEASE" ]; then
              PREV_TAG="$tag"
              break
            fi
          done <<< "$ALL_TAGS"

          echo "Previous tag: ${PREV_TAG:-<none found>}"
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          previous_tag: ${{ steps.previous_tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.test.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.test.outputs.is_prerelease == 'true' && 'false' || 'true' }}

  publish:
    name: Publish to PyPI
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Publish to PyPI
        run: uv publish
